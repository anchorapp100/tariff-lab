<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Tariff Lab · snapshot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='13' r='9' fill='%23e87ba4'/%3E%3Cpath d='M8 20q-3 5-6 4M13 22q-1 6-4 7M19 22q1 6 4 7M24 20q3 5 6 4' stroke='%23e87ba4' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="13" r="9" fill="var(--s5)"/><path d="M8 20q-3 5-6 4M13 22q-1 6-4 7M19 22q1 6 4 7M24 20q3 5 6 4" stroke="var(--s5)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="12.5" cy="12" r="1.7" fill="var(--surface)"/><circle cx="19.5" cy="12" r="1.7" fill="var(--surface)"/></svg>
      <div><b>Tariff Lab</b><span id="sub" class="muted"></span></div>
    </div>
    <div class="top-r">
      <span id="datapill" class="pill" hidden></span>
      <button id="btn-rerun" class="btn" hidden>Re-run</button>
      <button id="btn-theme" class="btn ghost" aria-label="Toggle light / dark theme" title="Theme">◐</button>
    </div>
  </div>
  <div id="banner" class="banner" hidden></div>
</header>

<div class="wrap">
  <div class="filters" id="filters" role="group" aria-label="Scenario filters">
    <label>Scenario
      <select id="sel-scn"></select>
    </label>
    <label>Controller
      <select id="sel-mode"><option value="rt">Realistic (forecast-driven)</option><option value="perfect">Perfect foresight (upper bound)</option></select>
    </label>
    <label>VAT on imports
      <select id="sel-vat"><option value="0">0 % (current)</option><option value="5">5 %</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="chk-brown"> Allow exporting grid-charged energy</label>
    <label class="chk"><input type="checkbox" id="chk-sc" checked> Include standing charges</label>
    <span id="runmsg" class="muted"></span>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
  <footer class="foot muted" id="foot"></footer>
  <p class="foot muted" id="legal">Unofficial and independent: not affiliated with or endorsed by Octopus Energy. Figures are model estimates for one household, not financial advice. Tariff rates: Octopus Energy public API. Weather forecasts: <a href="https://open-meteo.com/" rel="noopener noreferrer">Open-Meteo.com</a> (CC BY 4.0). Charts: <a href="https://echarts.apache.org/" rel="noopener noreferrer">Apache ECharts</a>.</p>
</div>

<script src="vendor/echarts.min.js"></script>
<script type="module" src="js/static_api.js"></script>
<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
